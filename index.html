<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dcebe7">
  <meta name="description" content="《航向以外》在线连载，适合手机阅读。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23102b3b'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='42' fill='%23e5a681'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
  <title>航向以外 · 在线阅读</title>
  <link rel="stylesheet" href="style.css">
  <script src="reader.js" defer></script>
</head>
<body>
  <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#top" aria-label="航向以外，回到顶部"><span class="brand-mark" aria-hidden="true">✳</span><span>航向以外</span></a>
      <button id="contents-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="contents">章节目录 <span aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main id="top">
    <section class="intro" aria-labelledby="book-title">
      <div class="intro-inner">
        <div class="intro-copy">
          <p class="eyebrow">一艘飞船上的故事</p>
          <h1 id="book-title">航向<span>以外</span></h1>
          <p id="intro-count" class="intro-note">连载中</p>
        </div>
        <div class="porthole" aria-hidden="true">
          <div class="porthole-sky">
            <span class="porthole-star star-one">✦</span>
            <span class="porthole-star star-two">·</span>
            <span class="porthole-orbit"></span>
            <span class="porthole-planet"></span>
          </div>
        </div>
      </div>
    </section>
    <div class="reading-shell">
      <nav id="contents" class="contents" aria-label="章节目录" hidden><div class="contents-heading"><span>目录</span><small>选择章节开始阅读</small></div><div id="chapter-list"></div></nav>
      <div class="reader-bar"><span id="chapter-count">正在载入故事</span><div class="reader-controls" role="group" aria-label="阅读设置"><button id="smaller" type="button" aria-label="缩小字号">A−</button><button id="larger" type="button" aria-label="放大字号">A+</button><button id="theme-toggle" type="button" aria-label="切换夜间模式" aria-pressed="false">☾</button></div></div>
      <article id="story" class="story"><p>正在载入故事……</p></article>
      <nav class="chapter-navigation" aria-label="章节翻页"><button id="previous" type="button">← 上一章</button><button id="next" type="button">下一章 →</button></nav>
      <footer><span class="footer-star">✳</span><p>故事还在继续。</p><a href="#top">回到顶部 ↑</a></footer>
    </div>
  </main>
</body>
</html>
