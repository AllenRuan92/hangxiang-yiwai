<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b3b">
  <meta name="description" content="《航向以外》在线连载，适合手机阅读。">
  <title>航向以外 · 在线阅读</title>
  <link rel="stylesheet" href="style.css">
  <script src="reader.js" defer></script>
</head>
<body>
  <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
  <header class="masthead">
    <a class="brand" href="#top" aria-label="回到顶部"><span class="brand-mark">✳</span><span>航向以外<small>一部航行中的故事</small></span></a>
    <button id="contents-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="contents">章节目录 <span aria-hidden="true">⌄</span></button>
  </header>
  <main id="top">
    <section class="intro" aria-labelledby="book-title">
      <div class="intro-inner">
        <p class="eyebrow"><span></span> 航行仍在继续</p>
        <h1 id="book-title">航向<span>以外</span></h1>
        <p class="intro-copy">在漫长的航行里，<br>每一天都有人认真生活。</p>
        <div class="coordinates" aria-hidden="true"><span>航行记录</span><span>✦</span><span>未完待续</span></div>
      </div>
    </section>
    <div class="reading-shell">
      <nav id="contents" class="contents" aria-label="章节目录" hidden><div class="contents-heading"><span>目录</span><small>选择章节开始阅读</small></div><div id="chapter-list"></div></nav>
      <div class="reader-bar"><span id="chapter-count">正在载入故事</span><div class="reader-controls" aria-label="阅读设置"><button id="smaller" type="button" aria-label="缩小字号">A−</button><button id="larger" type="button" aria-label="放大字号">A+</button><button id="theme-toggle" type="button" aria-label="切换夜间模式" aria-pressed="false">☾</button></div></div>
      <article id="story" class="story" aria-live="polite"><p>正在载入故事……</p></article>
      <nav class="chapter-navigation" aria-label="章节翻页"><button id="previous" type="button">← 上一章</button><button id="next" type="button">下一章 →</button></nav>
      <footer><span class="footer-star">✳</span><p>故事还在继续。</p><a href="#top">回到顶部 ↑</a></footer>
    </div>
  </main>
</body>
</html>
